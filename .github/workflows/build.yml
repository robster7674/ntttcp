name: Build

on:
  push:
    branches: main
  pull_request:
    branches: main
  # Fork-only, temporary: lets this branch's own CI build be triggered on
  # demand without pushing to main or opening a PR yet, to build and live-test
  # a fix before proposing it upstream. Drop this before filing the real PR.
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        submodules: recursive
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
    - name: Nuget Restore
      run: nuget.exe restore ntttcp.sln
    - name: Build
      # Diagnostic override (temporary, drop before any upstream PR): the
      # project hardcodes UndockedUseDriverToolset=true (WindowsApplication
      # ForDrivers10.0 toolset). A binary built that way through this exact
      # CI pipeline hangs at runtime on a live WS2025 test (near-0% CPU, no
      # output, not even respecting -to) - reproduced with BOTH the jitter
      # fix and an unmodified checkout, so it is a build-toolset question,
      # not a source-code one. /p: on the command line overrides the
      # project's own unconditional assignment (MSBuild global properties
      # win over in-project PropertyGroups). Forcing the standard v143
      # desktop toolset here to test that hypothesis directly.
      run: msbuild ntttcp.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:UndockedUseDriverToolset=false
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: bin-${{ matrix.platform }}
        path: build/bin
